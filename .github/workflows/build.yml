name: Build

on:
  push:
    branches: [devel, master]
    tags:
      - '*'
  pull_request:
    branches: [devel, master]
  workflow_dispatch:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows_mingw64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup MSYS2 and install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: true
          update: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-winpthreads

      - uses: actions/checkout@v6

      - name: Force static pthread
        run: |
          echo "--- available pthread libs ---"
          ls /ucrt64/lib/libpthread* /ucrt64/lib/libwinpthread* 2>/dev/null || true
          echo "--- replacing import libs with static ---"
          cp /ucrt64/lib/libwinpthread.a /ucrt64/lib/libwinpthread.dll.a
          [ -f /ucrt64/lib/libpthread.dll.a ] && cp /ucrt64/lib/libwinpthread.a /ucrt64/lib/libpthread.dll.a || true
          echo "--- done ---"

      - name: Configure project
        run: make config STRICT=1 VERBOSE=1 FEATURES='clap ui vst3'

      - name: Apply architecture tuning
        run: sed -i 's/-march=x86-64/-march=x86-64-v2/g' .config.mk

      - name: Fetch project dependencies
        run: make fetch

      - name: Build project
        run: make VERBOSE=1

      - name: Install
        run: make install

      - name: Bundle r3d library
        run: |
          cp INSTALL/lib/lsp-r3d-wgl-lib.dll INSTALL/lib/vst3/lsp-plugins.vst3/Contents/x86_64-win/
          cp INSTALL/lib/lsp-r3d-wgl-lib.dll INSTALL/lib/clap/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lsp-plugins-windows-ucrt64
          path: INSTALL/
          if-no-files-found: error

  release:
    name: Publish Release
    needs: windows_mingw64
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: lsp-plugins-windows-ucrt64
          path: release/

      - name: Zip release contents
        run: |
          cd release
          zip -r ../lsp-plugins-${{ github.ref_name }}-windows-ucrt64.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: lsp-plugins-${{ github.ref_name }}-windows-ucrt64.zip
          generate_release_notes: true
