```yaml
name: Build Windows Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build LSP Plugins 1.2.35
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: false
          install: >-
            base-devel
            git
            mingw-w64-x86_64-gcc

      - name: Checkout LSP Plugins 1.2.35
        uses: actions/checkout@v4
        with:
          ref: 1.2.35
          submodules: recursive

      - name: Verify source
        run: |
          echo "Building LSP Plugins 1.2.35"
          echo "Commit:"
          git rev-parse HEAD
          echo "Tag:"
          git describe --tags --always --exact-match HEAD || true

      - name: Configure
        run: |
          make config FEATURES='strict clap ladspa lv2 ui vst2 vst3'

      - name: Fetch dependencies
        run: |
          make fetch

      - name: Build
        run: |
          make VERBOSE=1

      - name: Install
        run: |
          make install

      - name: Show installed files
        run: |
          find INSTALL -type f -print

      - name: Create archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "INSTALL\*" `
            -DestinationPath "lsp-plugins-1.2.35-Windows-x86_64.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-1.2.35-Windows-x86_64
          path: lsp-plugins-1.2.35-Windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30
```
