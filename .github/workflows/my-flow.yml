name: Build Windows Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build LSP Plugins 1.2.35 for Windows
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2 and install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: false
          install: >-
            base-devel
            git
            mingw-w64-x86_64-gcc

      - name: Checkout LSP Plugins 1.2.35
        uses: actions/checkout@v4
        with:
          ref: 1.2.35
          submodules: recursive

      - name: Show source revision
        shell: msys2 {0}
        run: |
          echo "Building LSP Plugins 1.2.35"
          echo
          echo "Commit:"
          git rev-parse HEAD
          echo
          echo "Tag:"
          git describe --tags --always --exact-match HEAD || true

      - name: Configure project
        shell: msys2 {0}
        run: |
          make config FEATURES='strict clap ladspa lv2 ui vst2 vst3'

      - name: Fetch project dependencies
        shell: msys2 {0}
        run: |
          make fetch

      - name: Build project
        shell: msys2 {0}
        run: |
          make VERBOSE=1

      - name: Install plugins
        shell: msys2 {0}
        run: |
          make install

      - name: Show installed files
        shell: msys2 {0}
        run: |
          echo "Installed files:"
          find INSTALL -type f -print

      - name: Create Windows archive
        shell: pwsh
        run: |
          if (Test-Path "lsp-plugins-1.2.35-Windows-x86_64.zip") {
            Remove-Item "lsp-plugins-1.2.35-Windows-x86_64.zip" -Force
          }

          Compress-Archive `
            -Path "INSTALL\*" `
            -DestinationPath "lsp-plugins-1.2.35-Windows-x86_64.zip" `
            -CompressionLevel Optimal

      - name: Show archive
        shell: pwsh
        
